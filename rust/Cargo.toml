[package]
name = "kankal-grpc"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
argon2 = "0.5"
hex = "0.4"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
opentelemetry = { version = "0.33.0", default-features = false, features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["grpc-tonic", "metrics", "trace", "tls-ring"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["metrics", "trace"] }
prost = "0.14.4"
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = { version = "0.14.6", features = ["transport", "tls-ring"] }
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"
tonic-web = "0.14"
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14.6"

[dev-dependencies]
opentelemetry-proto = { version = "0.33.0", default-features = false, features = ["gen-tonic", "metrics", "trace"] }
rand = "0.8.8"
rsa = "0.9.10"
