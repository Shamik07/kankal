name: Go API

on:
  push:
    paths:
      - 'go/**'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - 'go/**'
      - '.github/workflows/go.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: kankal
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: kankal_test
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kankal -d kankal_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      KANKAL_TEST_DATABASE_URL: postgres://kankal:test-only-password@127.0.0.1:5432/kankal_test?sslmode=disable
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@2.54.3 lint docs/openapi.json
      - name: Check formatting
        run: gofmt_output=$(gofmt -l .) && test -z "$gofmt_output"
      - name: Vet
        run: go vet ./...
      - name: Install migration tool
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.0
      - name: Apply database migrations
        run: '"$(go env GOPATH)/bin/goose" -dir migrations postgres "$KANKAL_TEST_DATABASE_URL" up'
      - name: Test HTTP journey and race safety
        run: go test -race -count=1 ./...
      - name: Build runtime image
        run: docker build --pull -t kankal-go:ci .
      - name: Report image size
        run: docker image inspect --format '{{.Size}}' kankal-go:ci
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kankal-go:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
