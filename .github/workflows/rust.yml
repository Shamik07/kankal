name: Rust gRPC

on:
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt
      - uses: bufbuild/buf-action@v1
        with:
          version: '1.73.0'
          setup_only: true
      - name: Check Protobuf style
        run: |
          buf lint
          buf format --diff --exit-code
      - name: Check Protobuf compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}:rust/buf.yaml" 2>/dev/null; then
            buf breaking --against "../.git#ref=${BASE_SHA},subdir=rust"
          fi
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test isolated gRPC journey
        env:
          KANKAL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: cargo test --locked
      - name: Test workspace authorization
        env:
          KANKAL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: cargo test --locked --test workspace_journey -- --ignored
      - name: Build runtime image
        run: docker build --pull -t kankal-grpc:ci .
      - name: Report image size
        run: docker image inspect --format '{{.Size}}' kankal-grpc:ci
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kankal-grpc:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
