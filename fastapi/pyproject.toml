[project]
name = "kankal-ml"
version = "0.1.0"
description = "Standalone offline AI/ML API starter"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "uvicorn>=0.54,<0.55",
  "pydantic-settings>=2.15,<2.16",
  "httpx>=0.28,<0.29",
  "PyJWT[crypto]>=2.12,<3",
  "scikit-learn>=1.9.1,<1.10",
  "skops>=0.16,<0.17",
  "scalar-fastapi>=1.9.1,<1.10",
  "opentelemetry-sdk>=1.45,<1.46",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<1.46",
  "opentelemetry-instrumentation-fastapi>=0.66b0,<0.67",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "ruff>=0.16.9,<0.17",
  "mypy>=2.3.1,<2.4",
  "pip-audit>=2.10.1,<2.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["kankal_ml"]
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
