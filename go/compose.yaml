services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: kankal
      POSTGRES_DB: kankal
      POSTGRES_PASSWORD: ${KANKAL_LOCAL_DB_PASSWORD:?set KANKAL_LOCAL_DB_PASSWORD in your shell}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U kankal -d kankal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
